description:
  en: 'Change-aware quality loop for DSH coding agents: detects and safely repairs new lint regressions, checks TypeScript diagnostics and impacted Vitest/Jest tests, and emits a structured Quality Receipt that distinguishes existing failures from new ones.'
  zh: '面向 DSH 编码 Agent 的变更感知质量闭环：检测并安全修复本轮新增的 lint 问题，检查 TypeScript 诊断与受影响的 Vitest/Jest 测试，生成区分历史失败与新增问题的结构化 Quality Receipt。'
